<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TJ Hotels | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/ui.css">
  <link rel="stylesheet" href="/static/styles/auth.css">
</head>

<body class="bg-grid">
  <main class="auth-wrap">
    <div class="auth-stack">
      <div class="brand brand--auth">
        <img class="brand-logo-img" src="{{ url_for('static', filename='images/logo.png') }}" alt="TJ Hotels" />
      </div>

      <section class="glass-card auth-card">
        <h5 class="mb-1">Iniciar sesión</h5>
        <p class="text-muted mb-4">Encuentra hoteles en Tijuana</p>

        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input id="email" class="form-control" placeholder="correo@ejemplo.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary w-100" id="btnLogin">Iniciar sesión</button>

        <div class="mt-3 text-center small">
          ¿No tienes cuenta? <a href="/register">Regístrate</a>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
