<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TJ Hotels | App</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="static/styles/ui.css">
  <link rel="stylesheet" href="static/styles/app.css">
</head>

<body class="app-body">
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar glass-card">
    <div class="side-brand">
      <img class="brand-logo-img small"
           src="static/images/logo.png"
           alt="TJ Hotels"/>
    </div>

    <nav class="side-nav">
      <button class="nav-item active" data-view="inicio">
        <i class="bi bi-house-door-fill"></i>
        Inicio
      </button>

      <button class="nav-item" data-view="hoteles">
        <i class="bi bi-building"></i>
        Hoteles
      </button>

      <button class="nav-item" data-view="favoritos">
        <i class="bi bi-heart"></i>
        Favoritos
      </button>

      <div class="nav-sep"></div>

      <button class="nav-item" data-view="soporte">
        <i class="bi bi-gear"></i>
        Soporte
      </button>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">

    <!-- Topbar -->
    <header class="topbar glass-card">
      <div class="search">
        <span class="icon">🔎</span>
        <input id="q" placeholder="Buscar hoteles..." />
      </div>

      <div class="userbox">
        <span id="hello" class="text-muted">Hola</span>
        <button id="btnLogin" class="btn btn-light btn-sm">Iniciar sesión</button>
      </div>
    </header>

    <!-- Filters -->
    <section class="filters glass-card" id="filtersBar">
      <div class="chip">
        <span>💲</span>
        <select id="price">
          <option value="all">Precios</option>
          <option value="0-100">$</option>
          <option value="100-200">$$</option>
          <option value="200-999">$$$</option>
        </select>
      </div>

      <div class="chip">
        <span>⭐</span>
        <select id="rating">
          <option value="all">Rating</option>
          <option value="4.5">4.5+</option>
          <option value="4.0">4.0+</option>
          <option value="3.5">3.5+</option>
        </select>
      </div>

      <div class="chip">
        <span>📍</span>
        <select id="zone">
          <option value="all">Tijuana Zone</option>
          <option value="Zona Río">Zona Río</option>
          <option value="Centro">Centro</option>
          <option value="Otay">Otay</option>
          <option value="Playas">Playas</option>
        </select>
      </div>
    </section>

    <!-- Views -->
    <section class="views">

      <!-- ================= INICIO ================= -->
      <section class="view active" id="view-inicio">

        <!-- HERO -->
        <div class="glass-card p-0 overflow-hidden">
          <div class="hero">
            <img class="hero-img"
                 src="static/images/banner-tj-hotels.png"
                 alt="TJ Hotels banner" />

            <div class="hero-overlay">
              <div class="hero-title">Tu siguiente stay en Tijuana</div>
              <div class="hero-sub">
                Explora hoteles por zona, rating y servicios.
                Cuando elijas uno, te mandamos al sitio oficial para reservar.
              </div>

              <div class="hero-ctas">
                <button class="btn btn-primary btn-sm" id="btnGoHotels">Explorar hoteles</button>
              </div>
            </div>
          </div>
        </div>

        <!-- DESTACADOS -->
        <div class="row g-3 mt-3">
          <div class="col-12">
            <div class="glass-card p-3">

              <div class="featured-section mt-2">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="featured-title">Hoteles Destacados</div>
                </div>

                <div class="featured-carousel">
                  <div class="carousel-track" id="featuredTrack">
                    <div class="track-group" id="featuredGroup"></div>
                    <div class="track-group" id="featuredGroupClone" aria-hidden="true"></div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- REVIEWS -->
        <div class="glass-card p-3 mt-3">
          <div class="reviews-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="reviews-title">Opiniones recientes</div>
              <div class="text-muted small" id="reviewsNote">Cargando reseñas reales...</div>
            </div>

            <div class="reviews-carousel">
              <div class="reviews-track" id="reviewsTrack">
                <div class="reviews-group" id="reviewsGroup"></div>
                <div class="reviews-group" id="reviewsGroupClone" aria-hidden="true"></div> 
              </div>
            </div>
          </div>
        </div>

      </section>
<!-- ================= HOTELES / FAVORITOS ================= -->
<section class="view" id="view-grid">
  <section class="grid">

    <div class="list glass-card">
      <div class="list-head">
        <div>
          <div class="fw-semibold" id="listTitle">Hoteles</div>
          <div class="text-muted small" id="count"></div>
        </div>

        <!-- Controles SOLO para Hoteles (Places) -->
        <div class="list-actions" id="hotelsActions" style="display:none;">
          <select id="radiusSel" class="form-select form-select-sm">
            <option value="1000">1 km</option>
            <option value="2000">2 km</option>
            <option value="5000" selected>5 km</option>
            <option value="10000">10 km</option>
            <option value="20000">20 km</option>
          </select>

          <button class="btn btn-outline-primary btn-sm" id="btnGoFavs" type="button">
            ★ Favoritos
          </button>

          <button id="btnRefreshHotels" class="btn btn-outline-primary btn-sm" type="button">
            ⟳ Recargar
          </button>
        </div>
      </div>

      <div id="cards" class="cards"></div>
    </div>

    <div class="map glass-card">
      <div class="map-head">
        <div class="fw-semibold">Mapa</div>
      </div>

      <div id="map" class="map-canvas">
        <!-- botón flotante -->
        <button id="btnRecenter" class="map-fab" type="button" title="Volver a mi ubicación">
          ⌖
        </button>
      </div>
    </div>

  </section>
</section>
    <!-- ================= SOPORTE ================= -->
    <section class="view" id="view-soporte">
      <div class="glass-card p-3">
        <h5 class="mb-1">Soporte</h5>
        <div class="text-muted small">Próximamente: FAQ y contacto.</div>
      </div>
    </section>
  </main>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Google Maps loader (DEBE ir antes) -->
<script src="/static/js/maps-loader.js"></script>

<!-- Lógica del mapa de hoteles (usa el loader) -->
<script src="/static/js/maps-hotels.js"></script>

<!-- Carrusel destacados + reseñas -->
<script src="/static/js/featured-places.js"></script>

<!-- App -->
<script src="/static/js/app.js"></script>

</body>
</html>
